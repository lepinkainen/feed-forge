# Feed-Forge Configuration Example
#
# This file demonstrates the configuration format for feed-forge.
# Copy this to 'config.yaml' and customize for your needs.
#
# Note: CLI flags always override configuration file values.
# Field names use kebab-case to match CLI flag names.

# Base output directory for all generated feeds (optional).
# Provider outfile paths are relative to this directory.
# Absolute outfile paths are not affected.
# When set, bulletin-publish also writes HTML pages to <output-dir>/html/
# (a dated archive page plus a stable bulletin-latest.html), and the generated
# feed index links to the latest page.
output-dir: ""

# Public base URL for generated feeds in feeds.opml.
feed-base-url: "https://example.com/rss/"

# Directory for cache databases (optional).
# Defaults to $XDG_CACHE_HOME/feed-forge or ~/.cache/feed-forge.
cache-dir: ""

# Shared Anthropic (Claude) credentials, used by any processor that summarises
# via Claude (currently the bulletin pipeline). Prefer the ANTHROPIC_API_KEY
# environment variable — if you set the key here instead, chmod 600 this file and
# never commit it. Leave empty to use the env var.
anthropic:
  api-key: ""

# Reddit provider configuration
reddit:
  feed-id: "" # Required: Your Reddit feed ID (from https://www.reddit.com/prefs/feeds/)
  username: "" # Required: Your Reddit username
  min-score: 50 # Minimum post score to include
  min-comments: 10 # Minimum comment count to include
  outfile: reddit.xml # Output file path
  interval: 15m # Minimum time between regenerations (default: 15m)
  proxy-url: "" # Optional: Proxy URL for feed API (e.g. https://your-server.com/reddit-proxy.php)
  proxy-secret: "" # Optional: Shared secret for proxy authentication (X-Proxy-Secret header)
  og-proxy-url: "" # Optional: Proxy URL for OpenGraph fetching from reddit (e.g. https://your-server.com/reddit-og-proxy.php)

# Hacker News provider configuration
hackernews:
  min-points: 50 # Minimum points threshold
  limit: 30 # Maximum number of items
  outfile: hackernews.xml
  interval: 15m

# Simple providers need only their key to be enabled. Defaults:
# outfile <provider>.xml, and per-provider intervals set in code.

# Fingerpori provider configuration (defaults: limit 100, interval 24h)
fingerpori:

# Feissarimokat provider configuration (default interval 24h)
feissarimokat:

# xkcd provider configuration (default interval 6h)
xkcd:

# Oglaf provider configuration (default interval 12h)
oglaf:

# Tildes provider configuration
# Use either topic for one group or topics for multiple groups.
tildes:
  topic: tech
  topics: [] # e.g. [tech, science, games]
  outfile: tildes.xml
  interval: 30m

# Slashdot front-page provider configuration (canonical Atom feed)
# Slashdot requests at least 30 minutes between feed requests.
slashdot:
  outfile: slashdot.xml
  interval: 30m

# Lobsters provider configuration
lobsters:
  outfile: lobsters.xml
  interval: 30m
  min-score: 10
  tags: [] # e.g. [go, rust] -> /t/go.json, /t/rust.json

# Lemmy provider configuration
# The front page feed needs your account JWT. Set it with the LEMMY_JWT
# environment variable. The jwt-token key is a fallback only: the JWT is a
# full-access session for your account, it does not expire on its own, and a
# password change is the only way to revoke it. Do not commit it.
# Get the token from the browser cookie named "jwt" after you log in, or from
# POST <instance>/api/v3/user/login.
lemmy:
  instance: https://lemmy.world
  sort: Active # Active | Hot | New | TopDay | TopWeek | ...
  jwt-token: "" # prefer LEMMY_JWT
  min-score: 0
  min-comments: 0
  ignore-communities: [] # e.g. [memes, microblogmemes]
  limit: 0 # 0 = no client-side limit
  outfile: lemmy.xml
  interval: 30m

# YouTube provider configuration
# Shorts are filtered out by default when entries link to /shorts/<video_id>.
youtube:
  feed-urls: [] # e.g. [https://www.youtube.com/feeds/videos.xml?channel_id=UCT5C7yaO3RVuOgwP8JVAujQ]
  channel-ids: [] # e.g. [UCT5C7yaO3RVuOgwP8JVAujQ]
  limit: 30
  include-shorts: false
  outfile: youtube.xml
  interval: 30m

# Bulletin aggregator (separate code path, not a registry provider).
# Polls high-frequency source feeds, extracts full text, de-duplicates
# near-identical stories via SimHash, then publishes an LLM-summarised digest as
# a single Atom entry. The `serve` daemon schedules the three stages (see the
# serve: section below). To run them from cron instead, in this order:
#   */30 *    * * *  feed-forge bulletin-fetch                    # accumulate items all day
#   45   7,17 * * *  feed-forge bulletin-generate                 # summarise the backlog (calls the model)
#   50   7,17 * * *  feed-forge bulletin-publish -o bulletin.xml  # render HTML + Atom (no model, no writes)
#   feed-forge bulletin-summarize                                 # debug: print digest, no writes
# bulletin-generate and bulletin-summarize need an Anthropic API key: set
# `anthropic.api-key` above or the ANTHROPIC_API_KEY environment variable.
# bulletin-publish is a pure render, so re-run it to rebuild every HTML page.
bulletin:
  model: claude-haiku-4-5 # Anthropic model used for summarisation
  simhash-threshold: 3 # Max Hamming distance (of 64) to treat stories as duplicates
  max-tokens: 4096 # Upper bound on the digest response
  prompt-file: "" # Optional: path to a prompt template override for iteration
  feeds:
    - url: https://arstechnica.com/feed/
      name: Ars Technica # Display name used as the source link text in the digest
    - url: https://www.theverge.com/rss/index.xml
      name: The Verge

# Schedules for the `serve` daemon, which replaces the cron entries:
#   */5  *    * * *  feed-forge generate
#   */30 *    * * *  feed-forge bulletin-fetch
#   45   7,17 * * *  feed-forge bulletin-generate && feed-forge bulletin-publish
# The defaults below reproduce that cron setup; the section may be omitted
# entirely. One-shot commands ignore this section. `serve` reads its global
# settings (output-dir, feed-base-url, ...) from this file at startup and on
# every SIGHUP reload; global CLI flags do not apply to it. SIGHUP re-validates
# the file and applies it from the next scheduled run; an invalid file is
# rejected and the previous configuration stays active. A changed cache-dir
# needs a restart, not a reload.
serve:
  generate-tick: 5m # how often generate runs (per-provider `interval` still gates each feed)
  bulletin-fetch-interval: 30m # how often bulletin-fetch runs
  bulletin-slots: ["07:45", "17:45"] # local times to run bulletin-generate, then bulletin-publish; [] disables
